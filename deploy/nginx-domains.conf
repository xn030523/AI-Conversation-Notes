server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name s3.daiju.cc.cd mcp.daiju.cc.cd;
    include /etc/nginx/cloudflare-allow.conf;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name s3.daiju.cc.cd;
    include /etc/nginx/cloudflare-allow.conf;
    ssl_certificate /etc/letsencrypt/live/s3.daiju.cc.cd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/s3.daiju.cc.cd/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 0;

    location = /rustfs/console { return 301 /rustfs/console/; }
    location ^~ /rustfs/console/ {
        proxy_pass http://127.0.0.1:9001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
    }

    location = / {
        if ($http_accept ~* text/html) {
            return 302 /rustfs/console/;
        }
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mcp.daiju.cc.cd;
    include /etc/nginx/cloudflare-allow.conf;
    ssl_certificate /etc/letsencrypt/live/s3.daiju.cc.cd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/s3.daiju.cc.cd/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:5080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
